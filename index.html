<script type="text/babel" data-presets="react">
const {useState,useEffect,useLayoutEffect}=React;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

let LANG='es';

const supNum=n=>String(n).split('').map(c=>SUP[c]||c).join('');
const dec=s=>LANG==='es'?s.replace('.',','):s;
function sci(x,d=3){if(!isFinite(x))return '—';if(x===0)return '0';const ax=Math.abs(x);let e=Math.floor(Math.log10(ax)),m=ax/Math.pow(10,e),ms=m.toFixed(d-1);if(parseFloat(ms)>=10){m/=10;e+=1;ms=m.toFixed(d-1);}return dec(ms)+'×10'+supNum(e);}

const bf=B=>B>=1e-3?num(B*1e3,3)+' mT':num(B*1e6,3)+' µT';
const tt=(es,en)=>LANG==='es'?es:en;

/* ---------- modelo ---------- */
const MU0=4e-7*Math.PI,RHO=1.7e-8,A0=0.05,WIN=1600,FILL=0.6,JMAX=4;
let S={mode:'I',N:300,dw:1,d:5,I:3,V:12,Rx:0};
function calc(s){const a=A0,d=s.d/100,Aw=Math.PI*Math.pow(s.dw*1e-3/2,2),L=2*s.N*2*Math.PI*a,Rc=RHO*L/Aw,Rt=Rc+s.Rx;

  return{a,d,Aw,L,Rc,Rt,I,V,B:MU0*s.N*I*a*a/Math.pow(a*a+d*d/4,1.5),P:I*I*Rt,J:I/(Aw*1e6),Awmm:Aw*1e6,need:s.N*Aw*1e6,avail:FILL*WIN};}

/* Biot-Savart numerico: anillo de radio A0 con corriente unitaria, en (z,rho) */
const M=96,COS=[];for(let k=0;k<M;k++)COS.push(Math.cos((k+0.5)*2*Math.PI/M));

/* ---------- dibujo ---------- */
function fit(cv,aspect,minH,maxH){const w=Math.max(260,Math.floor(cv.parentElement.clientWidth-16));cv.style.width='100%';const h=Math.round(Math.min(maxH||9999,Math.max(minH||120,w*aspect)));const dpr=window.devicePixelRatio||1;cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h};}
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif';
function label(ctx,txt,x,y,col,font,align,base){ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;const wd=ctx.measureText(txt).width,x0=align==='center'?x-wd/2:align==='right'?x-wd:x,y0=base==='bottom'?y-17:base==='top'?y:y-9;ctx.fillStyle=css('--paper');ctx.globalAlpha=.92;ctx.fillRect(x0-4,y0-1,wd+8,19);ctx.globalAlpha=1;ctx.fillStyle=col;ctx.fillText(txt,x,y);}
function arrowHead(ctx,x,y,ang,col,s){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+s*Math.cos(ang),y+s*Math.sin(ang));ctx.lineTo(x+s*Math.cos(ang+2.5),y+s*Math.sin(ang+2.5));ctx.lineTo(x+s*Math.cos(ang-2.5),y+s*Math.sin(ang-2.5));ctx.closePath();ctx.fill();}
function drawField(){
  const cv=$('#cvF'),{ctx,w,h}=fit(cv,0.66,280,460);ctx.fillStyle=css('--paper');ctx.fillRect(0,0,w,h);
  const sc=Math.min((w-20)/(2*ZBOX),(h-20)/(2*RBOX)),X=z=>w/2+z*sc,Y=r=>h/2-r*sc,hd=S.d/200;
  ctx.setLineDash([5,5]);ctx.strokeStyle=css('--line');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(8,Y(0));ctx.lineTo(w-8,Y(0));ctx.stroke();ctx.setLineDash([]);

  const y0=Y(-A0)+rr+16;ctx.strokeStyle=css('--ink');ctx.fillStyle=css('--ink');ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(X(-hd),y0);ctx.lineTo(X(hd),y0);ctx.moveTo(X(-hd),y0-6);ctx.lineTo(X(-hd),y0+6);ctx.moveTo(X(hd),y0-6);ctx.lineTo(X(hd),y0+6);ctx.stroke();

}
function drawProfile(c){
  const cv=$('#cvP'),{ctx,w,h}=fit(cv,0.38,170,260);ctx.fillStyle=css('--paper');ctx.fillRect(0,0,w,h);
  const m={l:62,r:14,t:14,b:36},pw=w-m.l-m.r,ph=h-m.t-m.b,zs=0.15;let mx=0;const pts=[];for(let i=0;i<=120;i++){const z=-zs+2*zs*i/120,b=axisB(c,z);pts.push([z,b]);mx=Math.max(mx,b);}mx=Math.max(mx*1.15,1e-9);

}
const REFS=[[0.05e-3,{es:'Tierra',en:'Earth'}],[5e-3,{es:'Imán de nevera',en:'Fridge magnet'}],[0.3,{es:'Imán de neodimio',en:'Neodymium magnet'}],[1.5,{es:'Resonancia (1,5 T)',en:'MRI (1.5 T)'}]];
function drawRef(c){
  const cv=$('#cvR'),{ctx,w,h}=fit(cv,0.3,150,190);ctx.fillStyle=css('--paper');ctx.fillRect(0,0,w,h);
  const m=26,lo=-5,hi=0.8,X=B=>m+(Math.log10(Math.max(B,1e-6))-lo)/(hi-lo)*(w-2*m),yb=h*0.46,bh=26;

  ctx.font='12px '+FONT;ctx.fillStyle=css('--ink2');ctx.textAlign='center';ctx.textBaseline='middle';

<div className="min-h-screen">
<header className="top"><div className="wrap">
  <div className="toprow">

  <p className="authors">Emily Ramos y Ariel Alcívar</p>
  <div className="idea"><span className="es"><b>La idea en una frase:</b> una corriente eléctrica continua que pasa por muchas vueltas de cable crea un campo magnético que no cambia con el tiempo (estático). Aquí ves cómo cambia ese campo al mover las espiras, el cable, la distancia, la corriente y la resistencia.</span><span className="en"><b>The idea in one sentence:</b> a steady electric current going through many turns of wire creates a magnetic field that does not change with time (static). Here you can see how that field changes when you move the turns, the wire, the distance, the current and the resistance.</span></div>

  <h2><span className="es">1 · Cómo funciona</span><span className="en">1 · How it works</span></h2>
  <ol className="steps">
    <li><span className="es"><b>Una corriente crea un campo magnético.</b> Todo cable por el que pasa corriente tiene un campo magnético a su alrededor.</span><span className="en"><b>A current creates a magnetic field.</b> Every wire carrying current has a magnetic field around it.</span></li>
    <li><span className="es"><b>Una espira (una vuelta de cable) lo concentra.</b> Al doblar el cable en círculo, los campos de todas sus partes se suman en el centro.</span><span className="en"><b>A turn (one loop of wire) concentrates it.</b> When the wire is bent into a circle, the fields of all its parts add up at the center.</span></li>
    <li><span className="es"><b>Muchas espiras suman.</b> Con la misma corriente, <i>N</i> espiras dan <i>N</i> veces el campo de una.</span><span className="en"><b>Many turns add up.</b> With the same current, <i>N</i> turns give <i>N</i> times the field of one.</span></li>
    <li><span className="es"><b>Dos bobinas enfrentadas</b> suman sus campos en el espacio que queda entre ellas. Si están separadas una distancia igual a su radio (bobinas de Helmholtz), el campo en el centro es casi uniforme.</span><span className="en"><b>Two coils facing each other</b> add their fields in the space between them. If they are separated by a distance equal to their radius (Helmholtz coils), the field at the center is almost uniform.</span></li>
    <li><span className="es"><b>Estático</b> significa que no cambia con el tiempo: la corriente es continua (siempre la misma), por eso el campo siempre vale lo mismo. Se mide en tesla (T); 1 mT = 0,001 T.</span><span className="en"><b>Static</b> means it does not change with time: the current is direct (always the same), so the field always has the same value. It is measured in tesla (T); 1 mT = 0.001 T.</span></li>

      <p><span className="es"><b>Regla de la mano derecha:</b> cierra la mano derecha de modo que los dedos sigan el sentido de la corriente en la espira; el pulgar apunta en el sentido del campo en el interior de la espira. Si inviertes la corriente, el campo se invierte.</span><span className="en"><b>Right-hand rule:</b> curl the fingers of your right hand to follow the direction of the current in the loop; your thumb points in the direction of the field inside the loop. If you reverse the current, the field reverses.</span></p>

        <li><span className="es"><b>Dirección:</b> en cada punto, la tangente a la línea da la dirección del campo (la flecha de la línea marca el sentido).</span><span className="en"><b>Direction:</b> at each point, the tangent to the line gives the direction of the field (the arrow on the line gives the sense).</span></li>
        <li><span className="es"><b>Intensidad:</b> donde las líneas están más juntas, el campo es más fuerte; donde se separan, es más débil.</span><span className="en"><b>Strength:</b> where the lines are closer together, the field is stronger; where they spread apart, it is weaker.</span></li>
        <li><span className="es"><b>Son cerradas:</b> no empiezan ni terminan en ningún punto; cada línea da la vuelta y se cierra sobre sí misma. Es así porque no existen polos magnéticos aislados: si partes un imán, obtienes dos imanes, cada uno con su norte y su sur.</span><span className="en"><b>They are closed:</b> they do not start or end anywhere; each line loops around and closes on itself. This is because isolated magnetic poles do not exist: if you cut a magnet, you get two magnets, each with its own north and south.</span></li>
        <li><span className="es">Entre las dos bobinas las líneas son casi paralelas y equidistantes: ahí el campo es casi uniforme.</span><span className="en">Between the two coils the lines are almost parallel and evenly spaced: there the field is almost uniform.</span></li>
      </ul>
    </div>
    <div className="card wide">
      <h3><span className="es">Qué hace un campo estático</span><span className="en">What a static field does</span></h3>
      <div className="fx"><i>F</i> = <i>q</i> · <i>v</i> × <i>B</i></div>
      <ul>
        <li><span className="es"><b>Empuja a las cargas que se mueven.</b> La fuerza tiene módulo <i>F</i> = |<i>q</i>|·<i>v</i>·<i>B</i>·sen θ, donde θ es el ángulo entre la velocidad <i>v</i> y el campo <i>B</i>. Su dirección se obtiene también con la regla de la mano derecha.</span><span className="en"><b>It pushes moving charges.</b> The force has magnitude <i>F</i> = |<i>q</i>|·<i>v</i>·<i>B</i>·sin θ, where θ is the angle between the velocity <i>v</i> and the field <i>B</i>. Its direction also follows from the right-hand rule.</span></li>
        <li><span className="es"><b>Es perpendicular a la velocidad</b> (y a <i>B</i>), así que <b>no hace trabajo</b>: cambia la dirección de la carga, pero no su rapidez ni su energía. Por eso una partícula cargada en un campo uniforme describe una curva (un círculo si <i>v</i> es perpendicular a <i>B</i>, de radio <i>r</i> = <i>m</i>·<i>v</i> / (|<i>q</i>|·<i>B</i>)).</span><span className="en"><b>It is perpendicular to the velocity</b> (and to <i>B</i>), so it <b>does no work</b>: it changes the direction of the charge, but not its speed or energy. That is why a charged particle in a uniform field follows a curve (a circle if <i>v</i> is perpendicular to <i>B</i>, with radius <i>r</i> = <i>m</i>·<i>v</i> / (|<i>q</i>|·<i>B</i>)).</span></li>
        <li><span className="es"><b>A una carga quieta no le hace nada:</b> si <i>v</i> = 0, entonces <i>F</i> = 0.</span><span className="en"><b>It does nothing to a charge at rest:</b> if <i>v</i> = 0, then <i>F</i> = 0.</span></li>
      </ul>
    </div>
  </div>
</section>

<section id="sim">
  <h2><span className="es">2 · Mueve y mira</span><span className="en">2 · Move and watch</span></h2>
  <p className="sub"><span className="es">Cada control dice debajo qué cambia. Valores fijos: las dos bobinas tienen un radio de 5 cm, son de cobre y se conectan en serie.</span><span className="en">Each control says below what it changes. Fixed values: the two coils have a radius of 5 cm, are made of copper and are connected in series.</span></p>
  <p className="warn"><span className="es"><b>Sentido de la corriente.</b> «En serie» significa que la misma corriente pasa por una bobina y luego por la otra, y además debe circular <b>en el mismo sentido en las dos</b> (en el dibujo, ⊙ arriba y ⊗ abajo en ambas). Así sus campos apuntan hacia el mismo lado y se suman en el centro. Si la corriente fuera en sentidos opuestos, los campos se restarían y en el centro valdría cero.</span><span className="en"><b>Direction of the current.</b> “In series” means the same current goes through one coil and then the other, and it must also flow <b>in the same direction in both</b> (in the drawing, ⊙ at the top and ⊗ at the bottom in both). That way their fields point the same way and add up at the center. If the current flowed in opposite directions, the fields would subtract and at the center it would be zero.</span></p>
  <div className="lab">
    <div className="ctl">
      <div className="mode">
        <b><span className="es">¿Qué mantiene constante la fuente?</span><span className="en">What does the source keep constant?</span></b>
        <div className="chips" style={{marginTop:'8px'}}>
          <button className="chip" type="button" id="modeI" aria-pressed={s.mode==='I'} onClick={()=>upd({mode:'I'})}><span className="es">La corriente</span><span className="en">The current</span></button>
          <button className="chip" type="button" id="modeV" aria-pressed={s.mode==='V'} onClick={()=>upd({mode:'V'})}><span className="es">El voltaje</span><span className="en">The voltage</span></button>
        </div>
        <span className="help" id="modeHelp">{modeHelp}</span>
      </div>
      <div>
        <label htmlFor="rN"><span className="es">Espiras por bobina, N:</span><span className="en">Turns per coil, N:</span> <span className="val">{VAL.N}</span></label>
        <input type="range" id="rN" min="10" max="2000" step="10" value={s.N} onChange={e=>upd({N:+e.target.value})}/>
        <div className="ends"><span>10</span><span>2000</span></div>
        <span className="help"><span className="es">Cada espira es una vuelta de cable. Más espiras, más campo por cada amperio.</span><span className="en">Each turn is one loop of wire. More turns, more field for each ampere.</span></span>
      </div>
      <div>
        <label htmlFor="rW"><span className="es">Grosor del cable de cobre (diámetro):</span><span className="en">Thickness of the copper wire (diameter):</span> <span className="val">{VAL.W}</span></label>
        <input type="range" id="rW" min="0.2" max="3" step="0.05" value={s.dw} onChange={e=>upd({dw:+e.target.value})}/>
        <div className="ends"><span>0,2 mm</span><span>3 mm</span></div>
        <span className="help"><span className="es">Un cable más grueso deja pasar más corriente (menos resistencia), pero ocupa más espacio.</span><span className="en">A thicker wire lets more current through (less resistance), but takes up more space.</span></span>
      </div>
      <div>
        <label htmlFor="rS"><span className="es">Distancia entre las bobinas:</span><span className="en">Distance between the coils:</span> <span className="val">{VAL.S}</span></label>
        <input type="range" id="rS" min="1" max="20" step="0.5" value={s.d} onChange={e=>upd({d:+e.target.value})}/>
        <div className="ends"><span>1 cm</span><span>5 cm = radio</span><span>20 cm</span></div>
        <span className="help"><span className="es">A 5 cm (igual al radio) el campo del centro es casi uniforme.</span><span className="en">At 5 cm (equal to the radius) the field at the center is almost uniform.</span></span>
      </div>
      <div id="gI" style={{display:s.mode==='I'?'':'none'}}>
        <label htmlFor="rI"><span className="es">Corriente suministrada, I:</span><span className="en">Supplied current, I:</span> <span className="val">{VAL.I}</span></label>
        <input type="range" id="rI" min="0.1" max="20" step="0.1" value={s.I} onChange={e=>upd({I:+e.target.value})}/>
        <div className="ends"><span>0,1 A</span><span>20 A</span></div>
        <span className="help"><span className="es">Más corriente, más campo (y más calor).</span><span className="en">More current, more field (and more heat).</span></span>
      </div>
      <div id="gV" style={{display:s.mode==='V'?'':'none'}}>
        <label htmlFor="rV"><span className="es">Voltaje de la fuente, V:</span><span className="en">Source voltage, V:</span> <span className="val">{VAL.V}</span></label>
        <input type="range" id="rV" min="1" max="60" step="0.5" value={s.V} onChange={e=>upd({V:+e.target.value})}/>
        <div className="ends"><span>1 V</span><span>60 V</span></div>
        <span className="help"><span className="es">La corriente sale de V ÷ R: más voltaje, más corriente.</span><span className="en">The current comes from V ÷ R: more voltage, more current.</span></span>
      </div>
      <div>
        <label htmlFor="rR"><span className="es">Resistencia extra, R<sub>extra</sub>:</span><span className="en">Extra resistance, R<sub>extra</sub>:</span> <span className="val">{VAL.R}</span></label>
        <input type="range" id="rR" min="0" max="20" step="0.5" value={s.Rx} onChange={e=>upd({Rx:+e.target.value})}/>
        <div className="ends"><span>0 Ω</span><span>20 Ω</span></div>
        <span className="help"><span className="es">Es una resistencia que se pone en serie, además de la del propio cable. Se mide en ohmios (Ω).</span><span className="en">It is a resistor placed in series, in addition to that of the wire itself. It is measured in ohms (Ω).</span></span>
      </div>
    </div>

    <div>
      <div className="big"><span className="lab2"><span className="es">Campo magnético en el centro:</span><span className="en">Magnetic field at the center:</span></span><span className="num" id="bigB">{bf(c.B)}</span></div>
      <div className="plot"><h3><span className="es">Las líneas del campo (vista de lado)</span><span className="en">The field lines (side view)</span></h3><canvas id="cvF" role="img" aria-label="Líneas de campo magnético de dos bobinas"/>
        <div className="legend">
          <span><span className="dot" style={{background:'var(--blue)'}}></span><span className="es">línea de campo</span><span className="en">field line</span></span>
          <span><span className="dot" style={{background:'var(--red)'}}></span><span className="es">cable de la bobina visto de lado (⊙ la corriente sale hacia ti, ⊗ entra)</span><span className="en">coil wire seen from the side (⊙ current comes toward you, ⊗ goes in)</span></span>
        </div>
        <span className="help"><span className="es">Dibujo no a escala para las espiras: se dibuja un círculo rojo por lado, sin importar cuántas sean. La escala sí es real para la distancia.</span><span className="en">Not to scale for the turns: one red circle per side is drawn, no matter how many there are. The distance is drawn to real scale.</span></span>
      </div>
      <div className="plot"><h3><span className="es">Qué tan fuerte es el campo, comparado con otros</span><span className="en">How strong the field is compared with others</span></h3><canvas id="cvR" role="img" aria-label="Campo magnético en el centro comparado con otros campos"/></div>
      <div className="plot"><h3><span className="es">El campo a lo largo del eje</span><span className="en">The field along the axis</span></h3><canvas id="cvP" role="img" aria-label="Campo magnético a lo largo del eje de las bobinas"/>
        <span className="help"><span className="es">La zona plana entre las bobinas es donde el campo es uniforme. Las líneas verticales son las bobinas.</span><span className="en">The flat zone between the coils is where the field is uniform. The vertical lines are the coils.</span></span>
      </div>
      <p className="now" id="now" aria-live="polite" dangerouslySetInnerHTML={{__html:T.now}}/>
      <table className="read" id="readTbl" style={{marginTop:'12px'}} dangerouslySetInnerHTML={{__html:T.readTbl}}/>
    </div>
  </div>

  <div className="exp">
    <h3><span className="es">Prueba esto</span><span className="en">Try this</span></h3>
    <p className="grp"><span className="es">Cuando la fuente mantiene la <b>corriente</b> constante:</span><span className="en">When the source keeps the <b>current</b> constant:</span></p>
    <div className="chips">{expChips('A')}</div>
    <p className="grp"><span className="es">Cuando la fuente mantiene el <b>voltaje</b> constante:</span><span className="en">When the source keeps the <b>voltage</b> constant:</span></p>
    <div className="chips">{expChips('B')}</div>
    <p className="expres" id="expRes" aria-live="polite" dangerouslySetInnerHTML={{__html:T.expRes}}/>
  </div>
</section>

<section id="formulas">
  <h2><span className="es">3 · Las 4 fórmulas, letra por letra</span><span className="en">3 · The 4 formulas, letter by letter</span></h2>
  <p className="sub"><span className="es">Los valores de las tablas son los de la simulación en este momento: cámbialos con los controles y se actualizan.</span><span className="en">The values in the tables are those of the simulation right now: change them with the controls and they update.</span></p>
  <div className="grid2">
    <div className="card">
      <h3><span className="es">El campo en el centro</span><span className="en">The field at the center</span></h3>
      <div className="formula"><i className="res">B</i> = <span className="frac"><span>μ₀ · <i>N</i> · <i>I</i> · <i>a</i>²</span><span>(<i>a</i>² + (<i>d</i>/2)²)<sup>3/2</sup></span></span></div>
      <table className="leg" id="legB" dangerouslySetInnerHTML={{__html:T.legB}}/>
      <p><span className="es"><b>Cómo se lee:</b> arriba están las cosas que aumentan el campo (más espiras <i>N</i>, más corriente <i>I</i>); abajo, la distancia <i>d</i> entre las bobinas: si se separan, el denominador crece y el campo baja.</span><span className="en"><b>How to read it:</b> on top are the things that increase the field (more turns <i>N</i>, more current <i>I</i>); at the bottom, the distance <i>d</i> between the coils: if they move apart, the denominator grows and the field drops.</span></p>
      <p className="subst" id="substB" dangerouslySetInnerHTML={{__html:T.substB}}/>
    </div>
    <div className="card">
      <h3><span className="es">La corriente (ley de Ohm)</span><span className="en">The current (Ohm’s law)</span></h3>
      <div className="formula"><i className="res">I</i> = <span className="frac"><span><i>V</i></span><span><i>R</i></span></span></div>
      <table className="leg" id="legI" dangerouslySetInnerHTML={{__html:T.legI}}/>
      <p><span className="es"><b>Cómo se lee:</b> la corriente es el voltaje dividido entre la resistencia. Si la resistencia es mayor, pasa menos corriente y el campo baja; si es menor, pasa más corriente y el campo sube (pero también el calor).</span><span className="en"><b>How to read it:</b> the current is the voltage divided by the resistance. If the resistance is greater, less current flows and the field drops; if it is smaller, more current flows and the field rises (but so does the heat).</span></p>
      <p className="subst" id="substI" dangerouslySetInnerHTML={{__html:T.substI}}/>
    </div>
    <div className="card">
      <h3><span className="es">La resistencia del cable</span><span className="en">The resistance of the wire</span></h3>
      <div className="formula"><i className="res">R</i><sub style={{fontSize:'.6em'}}>cable</sub> = <span className="frac"><span>ρ · <i>L</i></span><span><i>A</i></span></span></div>
      <table className="leg" id="legR" dangerouslySetInnerHTML={{__html:T.legR}}/>
      <p><span className="es"><b>Cómo se lee:</b> un cable más largo (más espiras) tiene más resistencia; un cable más grueso (más sección <i>A</i>) tiene menos. La resistencia total es la del cable más la resistencia extra.</span><span className="en"><b>How to read it:</b> a longer wire (more turns) has more resistance; a thicker wire (larger cross-section <i>A</i>) has less. The total resistance is that of the wire plus the extra resistance.</span></p>
      <p className="subst" id="substR" dangerouslySetInnerHTML={{__html:T.substR}}/>
    </div>
    <div className="card">
      <h3><span className="es">El calor que se produce</span><span className="en">The heat produced</span></h3>
      <div className="formula"><i className="res">P</i> = <i>I</i>² · <i>R</i></div>
      <table className="leg" id="legP" dangerouslySetInnerHTML={{__html:T.legP}}/>
      <p><span className="es"><b>Cómo se lee:</b> la potencia es la energía por segundo que se convierte en calor en el cable. Crece con el cuadrado de la corriente: el doble de corriente, cuatro veces más calor.</span><span className="en"><b>How to read it:</b> the power is the energy per second that turns into heat in the wire. It grows with the square of the current: double the current, four times the heat.</span></p>
      <p className="subst" id="substP" dangerouslySetInnerHTML={{__html:T.substP}}/>
    </div>
  </div>
  <div className="card wide" style={{marginTop:'16px'}}>
    <h3><span className="es">De dónde sale la fórmula del campo</span><span className="en">Where the field formula comes from</span></h3>
    <p><span className="es"><b>Paso 1 · Una espira.</b> Cada trocito de cable aporta un poco de campo (ley de Biot–Savart). Sobre el eje, las componentes perpendiculares al eje se cancelan por simetría y solo suman las componentes a lo largo del eje. El resultado, para una bobina de <i>N</i> espiras y a una distancia <i>z</i> de su plano, es:</span><span className="en"><b>Step 1 · One loop.</b> Each little piece of wire contributes a bit of field (Biot–Savart law). On the axis, the components perpendicular to the axis cancel by symmetry and only the components along the axis add up. The result, for a coil of <i>N</i> turns at a distance <i>z</i> from its plane, is:</span></p>
    <div className="fx"><i>B</i><sub>bobina</sub>(<i>z</i>) = μ₀ · <i>N</i> · <i>I</i> · <i>a</i>² / [ 2 · (<i>a</i>² + <i>z</i>²)<sup>3/2</sup> ]</div>
    <p><span className="es">Con <i>z</i> = 0 (en el plano de la espira) da el conocido μ₀·<i>N</i>·<i>I</i> / (2·<i>a</i>).</span><span className="en">With <i>z</i> = 0 (in the plane of the loop) it gives the well-known μ₀·<i>N</i>·<i>I</i> / (2·<i>a</i>).</span></p>
    <p><span className="es"><b>Paso 2 · Dos bobinas.</b> Si están en <i>z</i> = ±<i>d</i>/2 y llevan la misma corriente en el mismo sentido, el campo total es la suma de las dos:</span><span className="en"><b>Step 2 · Two coils.</b> If they are at <i>z</i> = ±<i>d</i>/2 and carry the same current in the same direction, the total field is the sum of the two:</span></p>
    <div className="fx"><i>B</i>(<i>z</i>) = <i>B</i><sub>bobina</sub>(<i>z</i> − <i>d</i>/2) + <i>B</i><sub>bobina</sub>(<i>z</i> + <i>d</i>/2)</div>
    <p><span className="es">Esta es la curva de la gráfica «El campo a lo largo del eje». En el centro (<i>z</i> = 0) las dos bobinas aportan lo mismo, así que se suman dos mitades iguales y queda la fórmula de la tarjeta de arriba: <i>B</i> = μ₀·<i>N</i>·<i>I</i>·<i>a</i>² / (<i>a</i>² + (<i>d</i>/2)²)<sup>3/2</sup>.</span><span className="en">This is the curve in the graph “The field along the axis”. At the center (<i>z</i> = 0) both coils contribute the same, so two equal halves add up and you get the formula in the card above: <i>B</i> = μ₀·<i>N</i>·<i>I</i>·<i>a</i>² / (<i>a</i>² + (<i>d</i>/2)²)<sup>3/2</sup>.</span></p>
    <p><span className="es"><b>Paso 3 · Helmholtz.</b> Si la distancia es igual al radio (<i>d</i> = <i>a</i>):</span><span className="en"><b>Step 3 · Helmholtz.</b> If the distance equals the radius (<i>d</i> = <i>a</i>):</span></p>
    <div className="fx"><i>B</i> = μ₀·<i>N</i>·<i>I</i> / [ <i>a</i> · (5/4)<sup>3/2</sup> ] = (4/5)<sup>3/2</sup> · μ₀·<i>N</i>·<i>I</i> / <i>a</i> ≈ <span className="es">0,716</span><span className="en">0.716</span> · μ₀·<i>N</i>·<i>I</i> / <i>a</i></div>
    <p className="subst" id="substH" dangerouslySetInnerHTML={{__html:T.substH}}/>
    <p><span className="es"><b>Con corrientes opuestas</b> (configuración anti-Helmholtz) los dos términos del paso 2 tienen signo contrario y en el centro se anulan: <i>B</i>(0) = 0.</span><span className="en"><b>With opposite currents</b> (anti-Helmholtz configuration) the two terms in step 2 have opposite signs and cancel at the center: <i>B</i>(0) = 0.</span></p>
  </div>
</section>

<section id="summary">
  <h2><span className="es">4 · Qué pasa si…</span><span className="en">4 · What happens if…</span></h2>
  <table className="sum"><tbody>
    <tr><th><span className="es">Si aumentas…</span><span className="en">If you increase…</span></th><th><span className="es">Con corriente fija</span><span className="en">With fixed current</span></th><th><span className="es">Con voltaje fijo</span><span className="en">With fixed voltage</span></th></tr>
    <tr><td><span className="es">Las espiras</span><span className="en">The turns</span></td><td><span className="es">El campo aumenta (proporcional a N).</span><span className="en">The field increases (proportional to N).</span></td><td><span className="es">El campo casi no cambia: el cable es más largo, la resistencia sube y la corriente baja.</span><span className="en">The field hardly changes: the wire is longer, the resistance rises and the current drops.</span></td></tr>
    <tr><td><span className="es">La corriente</span><span className="en">The current</span></td><td><span className="es">El campo aumenta (proporcional a I). El calor aumenta con I².</span><span className="en">The field increases (proportional to I). The heat grows with I².</span></td><td><span className="es">Se consigue subiendo el voltaje o bajando la resistencia.</span><span className="en">It is achieved by raising the voltage or lowering the resistance.</span></td></tr>
    <tr><td><span className="es">El grosor del cable</span><span className="en">The wire thickness</span></td><td><span className="es">El campo no cambia (pero hay menos calor).</span><span className="en">The field does not change (but there is less heat).</span></td><td><span className="es">La resistencia baja, la corriente sube y el campo aumenta.</span><span className="en">The resistance drops, the current rises and the field increases.</span></td></tr>
    <tr><td><span className="es">La distancia entre bobinas</span><span className="en">The distance between coils</span></td><td><span className="es">El campo del centro baja.</span><span className="en">The field at the center drops.</span></td><td><span className="es">El campo del centro baja.</span><span className="en">The field at the center drops.</span></td></tr>
    <tr><td><span className="es">La resistencia</span><span className="en">The resistance</span></td><td><span className="es">El campo no cambia, pero la fuente necesita más voltaje y se produce más calor.</span><span className="en">The field does not change, but the source needs more voltage and more heat is produced.</span></td><td><span className="en">The current drops and the field drops.</span></td></tr>
    <tr><td><span className="es">El voltaje</span><span className="en">The voltage</span></td><td><span className="es">—</span><span className="en">—</span></td><td><span className="en">The current rises and the field rises.</span></td></tr>
  </tbody></table>
</section>

<section id="inside">
  <h2><span className="es">5 · Cómo sé que está bien</span><span className="en">5 · How I know it is right</span></h2>
  <div className="ok"><span className="tick">✓</span><div id="check" dangerouslySetInnerHTML={{__html:T.check}}/></div>
  <h3 style={{marginTop:'20px',fontSize:'1.2rem'}}><span className="es">Cómo funciona la simulación por dentro</span><span className="en">How the simulation works inside</span></h3>
  <ol className="steps">
    <li><span className="es">Divide cada espira en 96 trocitos de cable.</span><span className="en">It splits each turn into 96 little pieces of wire.</span></li>
    <li><span className="es">Cada trocito aporta un poquito de campo (ley de Biot–Savart) y se suman todos los trocitos de las dos bobinas.</span><span className="en">Each piece contributes a little field (Biot–Savart law) and the pieces of both coils are added up.</span></li>
    <li><span className="es">Las líneas azules se dibujan siguiendo la dirección de ese campo, paso a paso.</span><span className="en">The blue lines are drawn by following the direction of that field, step by step.</span></li>
  </ol>
  <h3 style={{marginTop:'18px',fontSize:'1.2rem'}}><span className="es">Lo que se simplifica</span><span className="en">What is simplified</span></h3>
  <ul className="simple">
    <li><span className="es">Las espiras se tratan como círculos delgados de radio 5 cm; no hay núcleo de hierro.</span><span className="en">The turns are treated as thin circles of radius 5 cm; there is no iron core.</span></li>
    <li><span className="es">El cobre está a 20 °C (resistividad 1,7×10⁻⁸ Ω·m). Al calentarse, su resistencia sube un poco.</span><span className="en">The copper is at 20 °C (resistivity 1.7×10⁻⁸ Ω·m). When it heats up, its resistance rises a little.</span></li>
    <li><span className="es">«El cable aguanta» usa una regla práctica: hasta unos 4 A por mm² de cable. «Cabe en el carrete» supone un carrete de 4 cm × 4 cm y que el cobre ocupa el 60 % de ese espacio.</span><span className="en">“The wire can take it” uses a rule of thumb: up to about 4 A per mm² of wire. “Fits on the spool” assumes a 4 cm × 4 cm spool and that copper fills 60 % of that space.</span></li>
  </ul>
